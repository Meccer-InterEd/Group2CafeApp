<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="page-heading">
        <h1>Real Café</h1>
        <p>Good coffee, made for you.</p>
    </header>

    <main class="screens">

        <!-- SCREEN 1: PRODUCT DETAILS -->
        <section class="phone product-screen">
            <div class="product-image">
                <img
                    src="Rectangle 184 (1).png"
                    alt="Freshly prepared cappuccino">
                <button class="back-button" aria-label="Go back">‹</button>
            </div>

            <div class="product-content">
                <div class="product-heading">
                    <div>
                        <h2>Cappuccino</h2>
                        <p>Drizzled with Caramel</p>
                    </div>
                    <span class="heart">♥</span>
                </div>

                <p class="rating">⭐ 4.5</p>

                <p class="description">
                    A single espresso shot poured into hot foamy milk,
                    topped with cocoa powder and sweet caramel syrup.
                </p>

                <h3>Choice of Milk</h3>

                <div class="milk-options">
                    <button class="selected">Oat Milk</button>
                    <button>Soy Milk</button>
                    <button>Almond Milk</button>
                </div>

                <div class="product-footer">
                    <div>
                        <p>Price</p>
                        <h2>₹249</h2>
                    </div>
                    <button class="primary-button">BUY NOW</button>
                </div>
            </div>


    
</body>
</html>
