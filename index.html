<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaymentPage</title>

</head>
<body>

    <div class="conatiner">

            <a href=""><img src="backIcon.jpg" alt="backicon" height="30px" width="45px"></a>
            <h1>Payment Method</h1>
        </div>
        <div class="h2container">
            <h2>Payment</h2>
        </div>

            <h3>Google Pay</h3>
        </div>
        <div class="confirmation">
            <a href="index.html"><img src="tickIcon.webp" alt="" height="80px" width="70px"></a>

        </div>
        <div class="address">

                <img src="flatsIcon.webp" alt="flatsIcon" height="46px" width="35px">
                <div class="textContainer">
                    <h3>Kayozz</h3>
                    <p>A-227/3, Nagali Puna Road, zkhera Kalan, New Delhi, Dehli 110082</p>
                </div>
            </div>
            <div class="adress-item">
                <img src="homeIcon.jpg" alt="homeIcon" height="50px" width="30px">
                <div class="textContainer">
                    <h3>Suraj Kumar</h3>
                    <p>B-22/3, Samaya Pur Badli Ind, Area, new Delhi, Delhi 110042</p>
                </div>
            </div>            
        </div>
        <div class="comfirm-bar">
            <a href=""><img src="backIcon.jpg" alt="backicon" height="30px" width="45px"></a>
            <button>Confirm</button>
        </div>
    </div>
    
</body>
</html>
